# Routine updates share one Monday batch; security fixes remain event-driven.
version: 2
multi-ecosystem-groups:
  weekly-maintenance:
    schedule:
      interval: weekly
      day: monday
      time: 09:00
      timezone: America/New_York
    labels:
      - dependencies
    open-pull-requests-limit: 1
updates:
  - package-ecosystem: github-actions
    directory: /
    labels:
      - dependencies
      - github-actions
    patterns:
      - '*'
    multi-ecosystem-group: weekly-maintenance
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: docker
    directory: /
    labels:
      - dependencies
      - docker
    patterns:
      - '*'
    multi-ecosystem-group: weekly-maintenance
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: docker
    directory: /ui
    labels:
      - dependencies
      - docker
    ignore:
      - dependency-name: node
        versions:
          - '>=25'
    patterns:
      - '*'
    multi-ecosystem-group: weekly-maintenance
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: pip
    directory: /
    labels:
      - dependencies
      - python
    # MCP 2 removes imported server APIs; migrate before widening pyproject.toml.
    ignore:
      - dependency-name: mcp
        update-types:
          - version-update:semver-major
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
    patterns:
      - '*'
    multi-ecosystem-group: weekly-maintenance
  - package-ecosystem: npm
    directory: /ui
    labels:
      - dependencies
      - javascript
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
    patterns:
      - '*'
    multi-ecosystem-group: weekly-maintenance
  - package-ecosystem: npm
    directory: /sdks/typescript
    labels:
      - dependencies
      - javascript
    patterns:
      - '*'
    multi-ecosystem-group: weekly-maintenance
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
