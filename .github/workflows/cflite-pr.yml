name: ClusterFuzzLite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Fuzzing exercises Python parsers only — skip on docs/UI/deploy-only PRs.
    # Not a required check, so workflow-level path filtering is safe here.
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite-pr.yml'
  schedule:
    - cron: '0 4 * * 1'  # Weekly batch fuzzing — Monday 04:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  Build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python

  PR-Fuzzing:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `mode: code-change` selects targets by diffing `<base_ref>...HEAD`
          # (oss-fuzz infra/cifuzz/continuous_integration.py), which needs a
          # merge base. ClusterFuzzLite fetches the base branch itself, but that
          # fetch leaves a depth-1 clone shallow, so no common ancestor exists
          # and the changed-file set comes back empty — the job then fuzzes
          # nothing and still exits 0. Same silent-skip shape as the MCP config
          # scanner above. Batch-Fuzzing needs no history: it fuzzes everything.
          fetch-depth: 0

      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python

      - name: Run fuzzers (code change — 60s per target)
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 60
          mode: code-change

  Batch-Fuzzing:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: Build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python

      - name: Run fuzzers (batch — 600s per target)
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: batch
