name: Deployment Freshness

# Checks that the protected Railway surface serves the exact latest release
# version and MCP tool-schema inventory, and that
# the Smithery catalog matches released tool names and input schemas. Runs
# daily and on-demand. Opens an issue if stale or misconfigured.
#
# No hosted-demo probe here. The public demo IS ours (Cloud Run, see
# demo-deploy-cloudrun.yml), but its freshness is gated at deploy time: that
# workflow asserts the served version matches the image it just pushed and that
# the seeded estate is non-empty, and it fails the deploy otherwise. Its URL is
# also not a repo-level configured surface, so there is nothing for this daily
# probe to resolve. If the demo ever needs continuous monitoring rather than
# deploy-time verification, add it here rather than assuming it is covered.

on:
  schedule:
    - cron: "0 8 * * *"  # daily at 08:00 UTC
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy MCP SSE"]
    types: [completed]

concurrency:
  group: deployment-freshness-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: ${{ github.event_name != 'workflow_run' || contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get expected contract from latest published release
        id: expected
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")
          RELEASE_TAG=$(echo "$RELEASE_JSON" | jq -er '.tag_name')
          if [ "$(echo "$RELEASE_JSON" | jq -r '.draft != false')" = "true" ]; then
            echo "::error::Latest GitHub release is a draft"
            exit 1
          fi
          git fetch --force --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          RELEASE_SHA=$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")
          VERSION="${RELEASE_TAG#v}"
          METRICS_JSON=$(git show "${RELEASE_SHA}:docs/PRODUCT_METRICS.json")
          METRICS_VERSION=$(echo "$METRICS_JSON" | jq -er '.version')
          TOOL_COUNT=$(echo "$METRICS_JSON" | jq -er '(first(.metrics[] | select(.name == "MCP default tools") | .value) // first(.metrics[] | select(.name == "MCP tools") | .value))')
          if [ "$METRICS_VERSION" != "$VERSION" ]; then
            echo "::error::Published release metrics version $METRICS_VERSION does not match $VERSION"
            exit 1
          fi
          if ! echo "$TOOL_COUNT" | grep -qE '^[1-9][0-9]*$'; then
            echo "::error::Published release metrics do not declare a positive MCP tool count"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tool_count=$TOOL_COUNT"
            echo "release_sha=$RELEASE_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Expected published contract: v${VERSION}, ${TOOL_COUNT} MCP tools"

      - name: Export exact published release schemas
        run: |
          set -euo pipefail
          python3 scripts/check_glama_listing.py \
            --write-tool-names /tmp/deployment-expected-tool-names.json \
            --git-ref "${{ steps.expected.outputs.release_sha }}"
          python3 scripts/export_release_mcp_contract.py \
            --expected "${{ steps.expected.outputs.version }}" \
            --expected-tool-names-file /tmp/deployment-expected-tool-names.json \
            --out /tmp/deployment-expected-tool-contract.json

      - name: Check Railway deployment
        shell: bash
        id: railway
        continue-on-error: true
        env:
          RAILWAY_MCP_URL: ${{ vars.RAILWAY_MCP_URL }}
          RAILWAY_MCP_BEARER_TOKEN: ${{ secrets.RAILWAY_MCP_BEARER_TOKEN }}
          MCP_PROBE_OAUTH_ISSUER: ${{ vars.MCP_PROBE_OAUTH_ISSUER }}
          MCP_PROBE_OAUTH_TOKEN_URL: ${{ vars.MCP_PROBE_OAUTH_TOKEN_URL }}
          MCP_PROBE_OAUTH_AUDIENCE: ${{ vars.MCP_PROBE_OAUTH_AUDIENCE }}
          MCP_PROBE_OAUTH_CLIENT_ID: ${{ vars.MCP_PROBE_OAUTH_CLIENT_ID }}
          MCP_PROBE_OAUTH_CLIENT_SECRET: ${{ secrets.MCP_PROBE_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          echo "probe_failed=true" >> "$GITHUB_OUTPUT"
          DEPLOY_URL="${RAILWAY_MCP_URL:-https://agent-bom-mcp.up.railway.app}"
          if RESPONSE=$(PYTHONPATH=src python3 scripts/deploy/probe_with_oauth.py -- \
            --base-url "$DEPLOY_URL" \
            --server-card --require-mcp-auth \
            --expected-version "${{ steps.expected.outputs.version }}" \
            --expected-tool-count "${{ steps.expected.outputs.tool_count }}" \
            --attempts 3 \
            --backoff-seconds 5 \
            --timeout 15); then
            DEPLOYED=$(echo "$RESPONSE" | jq -er '.serverInfo.version')
            TOOL_COUNT=$(echo "$RESPONSE" | jq -er '.tools | length')
            echo "$RESPONSE" | jq -S '[.tools[] | {name, inputSchema}] | sort_by(.name)' > /tmp/railway-actual-tool-contract.json
            if ! python3 scripts/check_surface_freshness.py \
              --compare-tool-contract-files /tmp/deployment-expected-tool-contract.json /tmp/railway-actual-tool-contract.json; then
              {
                echo "railway_version=$DEPLOYED (schema drift)"
                echo "tool_count=$TOOL_COUNT"
              } >> "$GITHUB_OUTPUT"
              echo "::warning::Railway schemas differ from the published release; reconcile the deployed artifact"
              exit 0
            fi
          else
            {
              echo "railway_version=unreachable"
              echo "tool_count=unknown"
              echo "probe_failed=true"
            } >> "$GITHUB_OUTPUT"
            echo "::warning::Railway authenticated MCP or published contract check failed"
            exit 0
          fi
          {
            echo "probe_failed=false"
            echo "railway_version=$DEPLOYED"
            echo "tool_count=$TOOL_COUNT"
          } >> "$GITHUB_OUTPUT"
          echo "Railway contract: v${DEPLOYED}, ${TOOL_COUNT} tools"

      - name: Check Smithery catalog listing
        shell: bash
        id: public
        continue-on-error: true
        env:
          SMITHERY_SERVER_QUALIFIED_NAME: ${{ vars.SMITHERY_SERVER_QUALIFIED_NAME }}
          SMITHERY_MCP_URL: ${{ vars.SMITHERY_MCP_URL }}
          EXPECTED_TOOL_COUNT: ${{ steps.expected.outputs.tool_count }}
        run: |
          set -euo pipefail
          # Stay fail-closed if contract extraction or probing exits early.
          echo "probe_failed=true" >> "$GITHUB_OUTPUT"
          python3 scripts/check_surface_freshness.py \
            --surface smithery \
            --expected "${{ steps.expected.outputs.version }}" \
            --expected-tool-count "$EXPECTED_TOOL_COUNT" \
            --expected-tool-names-file /tmp/deployment-expected-tool-names.json \
            --expected-tool-contract-file /tmp/deployment-expected-tool-contract.json \
            --out /tmp/deployment-smithery-report.json
          STATE=$(jq -er '.surfaces[0].status' /tmp/deployment-smithery-report.json)
          TOOL_COUNT=$(jq -r '.surfaces[0].tool_count // "unknown"' /tmp/deployment-smithery-report.json)
          {
            echo "public_version=$STATE"
            echo "tool_count=$TOOL_COUNT"
            echo "auth_required=smithery-oauth"
          } >> "$GITHUB_OUTPUT"
          if [ "$STATE" = "fresh" ]; then
            echo "probe_failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Smithery catalog differs from the published tool-name and input-schema contract"
          fi

      # Railway remains the required freshness gate. Smithery status is recorded
      # without treating an unavailable catalog probe as proof of recovery.
      - name: Reconcile deployment monitoring issues
        if: ${{ always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_VERSION: ${{ steps.expected.outputs.version }}
          RAILWAY_VERSION: ${{ steps.railway.outputs.railway_version }}
          RAILWAY_TOOLS: ${{ steps.railway.outputs.tool_count }}
          RAILWAY_OUTCOME: ${{ steps.railway.outcome }}
          RAILWAY_PROBE_FAILED: ${{ steps.railway.outputs.probe_failed }}
          RAILWAY_STALE: ${{ steps.railway.outputs.stale }}
          PUBLIC_VERSION: ${{ steps.public.outputs.public_version }}
          PUBLIC_TOOLS: ${{ steps.public.outputs.tool_count }}
          PUBLIC_OUTCOME: ${{ steps.public.outcome }}
          PUBLIC_NOT_CONFIGURED: ${{ steps.public.outputs.not_configured }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const labels = ["supply-chain-drift", "security-preventive", "automated"];
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "all", labels: "supply-chain-drift", per_page: 100,
            });
            async function reconcile(title, legacyPrefix, state, body) {
              const candidates = existing.filter(issue => !issue.pull_request &&
                (issue.title === title || (legacyPrefix && issue.title.startsWith(legacyPrefix))));
              if (state === "closed") {
                for (const issue of candidates.filter(issue => issue.state === "open")) {
                  await github.rest.issues.update({owner, repo, issue_number: issue.number,
                    state: "closed", state_reason: "completed", body});
                }
                return;
              }
              // Completed trackers are reusable. Duplicates closed as not_planned
              // stay closed; stable-title trackers take precedence over legacy ones.
              const eligible = candidates.filter(issue => issue.state === "open" || issue.state_reason === "completed")
                .sort((a, b) => Number(b.title === title) - Number(a.title === title) || a.number - b.number);
              const match = eligible.find(issue => issue.state === "open") || eligible[0];
              if (match) {
                if (match.state === "open" && match.title === title && match.body === body) return;
                await github.rest.issues.update({owner, repo, issue_number: match.number, title, body, state: "open"});
              } else {
                for (const name of labels) {
                  try { await github.rest.issues.createLabel({owner, repo, name}); } catch (e) {}
                }
                await github.rest.issues.create({owner, repo, title, body, labels});
              }
            }
            const e = process.env;
            const title = "supply-chain-drift: deployment surfaces out of sync";
            const fresh = Boolean(e.EXPECTED_VERSION) && e.RAILWAY_VERSION === e.EXPECTED_VERSION &&
              e.RAILWAY_OUTCOME === "success" && e.RAILWAY_PROBE_FAILED === "false" && e.RAILWAY_STALE !== "true";
            const body = [
              fresh ? "## Deployment freshness verified" : "## Supply-Chain Drift Check Failed",
              "",
              "| Surface | Version | Expected | Tool Count |",
              "|---------|---------|----------|------------|",
              `| Railway (protected) | ${e.RAILWAY_VERSION || "unverified"} | ${e.EXPECTED_VERSION || "unknown"} | ${e.RAILWAY_TOOLS || "unknown"} |`,
              `| Smithery catalog | ${e.PUBLIC_VERSION || "unverified"} | ${e.EXPECTED_VERSION || "unknown"} | ${e.PUBLIC_TOOLS || "unknown"} |`,
              "",
              fresh ? "The required protected Railway probe matches the published version and tool schemas." :
                "**Action**: Reconcile the protected Railway deployment with the published version and tool schemas, then re-run Deployment Freshness.",
              "Smithery catalog status is reported separately and does not determine the required deployment gate.",
            ].join("\n");
            await reconcile(title, `${title} with `, fresh ? "closed" : "open", body);
            const monitoringTitle = "deployment-monitoring: a deployment surface is UNMONITORED (missing config)";
            if (e.PUBLIC_NOT_CONFIGURED === "true") {
              await reconcile(monitoringTitle, null, "open", [
                "## Deployment surface is unmonitored", "",
                "Smithery catalog monitoring is not configured. Set repository variable `SMITHERY_SERVER_QUALIFIED_NAME` if the listing is not `agentbom/agent-bom`, then re-run Deployment Freshness.",
                "This tracker closes only after a successful probe step explicitly reports a configured surface.",
              ].join("\n"));
            } else if (e.PUBLIC_OUTCOME === "success" && e.PUBLIC_VERSION && e.PUBLIC_NOT_CONFIGURED !== "true") {
              await reconcile(monitoringTitle, null, "closed", "Deployment surfaces are configured for monitoring. Freshness is tracked separately.");
            }

      - name: Require deployment freshness
        if: always()
        env:
          EXPECTED_VERSION: ${{ steps.expected.outputs.version }}
          RAILWAY_VERSION: ${{ steps.railway.outputs.railway_version }}
          RAILWAY_OUTCOME: ${{ steps.railway.outcome }}
          RAILWAY_PROBE_FAILED: ${{ steps.railway.outputs.probe_failed }}
          PUBLIC_OUTCOME: ${{ steps.public.outcome }}
          PUBLIC_PROBE_FAILED: ${{ steps.public.outputs.probe_failed }}
          PUBLIC_VERSION: ${{ steps.public.outputs.public_version }}
        run: |
          if [ -z "$EXPECTED_VERSION" ] || [ "$RAILWAY_VERSION" != "$EXPECTED_VERSION" ] ||
             [ "$RAILWAY_OUTCOME" != "success" ] || [ "$RAILWAY_PROBE_FAILED" != "false" ]; then
            echo "::error::Deployment freshness failed; recording an incident does not make a failed or missing probe pass"
            exit 1
          fi
          # Smithery/"public" is a known, accepted, structural OAuth gap (see
          # PR #5317) and must never fail this gate -- only Railway does. Still
          # surface it loudly so it stays visible, never silently swallowed.
          if [ "$PUBLIC_OUTCOME" != "success" ] || [ "$PUBLIC_PROBE_FAILED" != "false" ] || [ "$PUBLIC_VERSION" != "fresh" ]; then
            echo "::warning::Smithery/public marketplace is not verified fresh (structural OAuth gap, non-blocking; see PR #5317)"
          fi
