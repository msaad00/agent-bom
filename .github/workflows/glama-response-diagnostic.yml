name: Glama Response Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Capture anonymous public listing responses
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, time
          spec = importlib.util.spec_from_file_location('glama', 'scripts/check_glama_listing.py')
          glama = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(glama)
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'glama-response'
          output.mkdir()
          evidence = []
          for attempt in range(1, 4):
              for kind, url in [('listing', glama.DEFAULT_URL), ('schema', glama.DEFAULT_SCHEMA_URL)]:
                  try:
                      page = glama._fetch(url, 20)
                      (output / f'{kind}-{attempt}.html').write_text(page)
                      evidence.append({'kind': kind, 'attempt': attempt, 'bytes': len(page.encode()),
                          'sha256': hashlib.sha256(page.encode()).hexdigest(),
                          'version': glama._extract_listing_version(page),
                          'visible_prefix': glama._visible_text(page)[:1500]})
                  except Exception as exc:
                      evidence.append({'kind': kind, 'attempt': attempt, 'error_type': type(exc).__name__})
              if attempt < 3:
                  time.sleep(5)
          (output / 'summary.json').write_text(json.dumps(evidence, indent=2))
          print(json.dumps(evidence, indent=2))
          PY
      - name: Upload public response evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glama-public-response
          path: ${{ runner.temp }}/glama-response/
          retention-days: 7
          if-no-files-found: error
