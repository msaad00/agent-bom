name: Perf Scale Evidence

# Regenerates the lightweight in-process scale evidence on a weekly cadence
# so docs/perf/results/ stays current as the graph builder evolves. The
# 1k-estate run takes <1 minute on github-hosted runners and is the floor
# evidence referenced from docs/perf/ingest-throughput.md and
# docs/ENTERPRISE_DEPLOYMENT.md. Graph API/Postgres benchmark scaffolds are
# dry-run validated here. The opt-in mixed_graph input also measures bounded
# graph HTTP requests during ingestion; it is not a production capacity claim.

on:
  schedule:
    - cron: "0 4 * * 1"  # Mondays 04:00 UTC
  workflow_dispatch:
    inputs:
      mixed_graph:
        description: "Also measure graph HTTP reads during ingestion on a million-node synthetic fixture"
        type: boolean
        default: false
      mixed_graph_seconds:
        description: "Mixed-load duration (0 uses fixed counts; maximum 600 seconds)"
        type: string
        default: "0"
      open_pr:
        description: "Open a PR if the regenerated JSON differs from the checked-in baseline"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: perf-scale-evidence
  cancel-in-progress: false

jobs:
  regenerate-scale-evidence:
    name: Regenerate scale evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"

      - name: Install agent-bom (from source)
        run: uv sync --extra dev

      - name: Regenerate in-process scale evidence
        id: regen
        run: |
          set -euo pipefail
          OUTPUT="docs/perf/results/scale-evidence-local-$(date -u +%Y-%m-%d).json"
          uv run python scripts/run_scale_evidence.py --output "$OUTPUT"
          echo "output=$OUTPUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUTPUT"

      - name: Validate evidence against schema
        run: uv run python scripts/check_scale_evidence.py

      - name: Validate graph API/Postgres benchmark scaffold
        run: |
          set -euo pipefail
          uv run python scripts/generate_graph_benchmark_estate.py \
            --agents 25 \
            --report-output /tmp/graph-benchmark-estate-report.json \
            --summary-output /tmp/graph-benchmark-estate-summary.json
          uv run python scripts/run_graph_api_benchmark.py \
            --dry-run \
            --output /tmp/graph-api-benchmark.json
          uv run python scripts/run_graph_postgres_explain.py \
            --dry-run \
            --output-dir /tmp/postgres-graph-explain \
            --summary-output /tmp/postgres-graph-explain.json
          uv run pytest tests/test_graph_benchmark_scaffold.py -q

      - name: Run measured graph scale assertion
        run: uv run pytest tests/graph/test_store_backed_build_wiring.py -q -m graph_performance

      - name: Upload result artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scale-evidence-${{ github.run_id }}
          path: ${{ steps.regen.outputs.output }}
          retention-days: 90

      - name: Open PR if regenerated evidence differs (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && inputs.open_pr == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/perf/results/; then
            echo "No diff in docs/perf/results/; nothing to PR."
            exit 0
          fi
          BRANCH="auto/perf-scale-evidence-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/perf/results/
          git commit -m "perf: refresh scheduled scale evidence ($(date -u +%Y-%m-%d))"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "perf: refresh scheduled scale evidence" \
            --body "Automated refresh of \`docs/perf/results/\` from the weekly scale-evidence run. See #1806."

  mixed-graph:
    if: github.event_name == 'workflow_dispatch' && inputs.mixed_graph == true
    permissions:
      contents: read
    name: Measure synthetic graph reads during ingestion
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.13"
      - name: Install locked harness environment
        run: uv sync --frozen --extra api --extra dev
      - name: Verify evidence contracts
        run: uv run pytest -q tests/test_graph_mixed_scale_evidence.py
      - name: Run four-tenant million-node fixture
        env:
          MIXED_GRAPH_SECONDS: ${{ inputs.mixed_graph_seconds }}
        run: >-
          uv run python scripts/run_graph_mixed_scale_evidence.py
          --output "$RUNNER_TEMP/graph-mixed-evidence"
          --duration-seconds "$MIXED_GRAPH_SECONDS"
      - name: Preserve successful and failed measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graph-mixed-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/graph-mixed-evidence/receipt.json
            ${{ runner.temp }}/graph-mixed-evidence/server.log
          if-no-files-found: warn
          retention-days: 30
