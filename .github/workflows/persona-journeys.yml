name: Persona Journeys

# Drives the installed CLI and control plane end to end as four personas
# (developer, platform, GRC, AI builder) using scripts/persona_journeys.py.
# Unit and contract suites prove modules in isolation; this lane proves the
# documented first-run path still works across surfaces: scan -> artifacts ->
# self-hosted control plane -> findings push/list -> compliance evaluation.

on:
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/persona_journeys.py"
      - ".github/workflows/persona-journeys.yml"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: persona-journeys-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  journeys:
    name: Persona journeys (CLI + control plane)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --extra api --extra mcp-server

      - name: Run persona journeys
        run: uv run python scripts/persona_journeys.py --report persona-report.json

      - name: Upload persona report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persona-journeys-report
          path: persona-report.json
          if-no-files-found: ignore
