name: Runtime Helm Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/runtime-acceptance.yml'
      - 'scripts/demo/*runtime*'
      - 'tests/api/test_gateway_runtime_acceptance.py'
      - 'src/agent_bom/gateway*'
      - 'src/agent_bom/runtime/**'
      - 'src/agent_bom/api/**'
      - 'deploy/helm/agent-bom/**'
      - 'deploy/supabase/postgres/**'
      - 'ui/app/gateway/**'
      - 'ui/lib/gateway-activity.ts'
      - 'ui/server/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-acceptance.yml'
      - 'scripts/demo/*runtime*'
      - 'tests/api/test_gateway_runtime_acceptance.py'
      - 'src/agent_bom/gateway*'
      - 'src/agent_bom/runtime/**'
      - 'src/agent_bom/api/**'
      - 'deploy/helm/agent-bom/**'
      - 'deploy/supabase/postgres/**'
      - 'ui/app/gateway/**'
      - 'ui/lib/gateway-activity.ts'
      - 'ui/server/**'

permissions:
  contents: read

concurrency:
  group: runtime-acceptance-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  helm-runtime:
    name: Gateway ingest and replica reconnect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned kind and Helm
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
          echo '50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  /tmp/kind' | sha256sum -c -
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          curl -fsSLo /tmp/helm.tar.gz https://get.helm.sh/helm-v4.1.4-linux-amd64.tar.gz
          echo '70b2c30a19da4db264dfd68c8a3664e05093a361cefd89572ffb36f8abfa3d09  /tmp/helm.tar.gz' | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install and build production dashboard
        working-directory: ui
        run: |
          npm ci
          npm run verify:toolchain
          npm run build
          cp -R .next/static .next/standalone/.next/static
          mkdir -p .next/standalone/public
          cp -R public/. .next/standalone/public/
          npx playwright install --with-deps chromium
      - name: Build the control-plane and gateway image
        run: docker build --build-arg AGENT_BOM_EXTRAS=api,postgres -t agent-bom:runtime-acceptance .
      - name: Create isolated kind cluster
        run: |
          set -euo pipefail
          kind create cluster --name runtime-acceptance --kubeconfig "$RUNNER_TEMP/runtime-kubeconfig" --image kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
          kind load docker-image agent-bom:runtime-acceptance --name runtime-acceptance
      - name: Verify actual Helm gateway delivery and reconnect
        run: python3 scripts/demo/check_runtime_reconnect.py --kubeconfig "$RUNNER_TEMP/runtime-kubeconfig" --ui-root "$GITHUB_WORKSPACE/ui" --output "$RUNNER_TEMP/runtime-helm-proof.json"
      - name: Upload non-secret acceptance result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-helm-acceptance
          path: |
            ${{ runner.temp }}/runtime-helm-proof.json
            ${{ runner.temp }}/runtime-helm-proof/*.png
          if-no-files-found: error
      - name: Remove isolated cluster
        if: always()
        run: kind delete cluster --name runtime-acceptance
