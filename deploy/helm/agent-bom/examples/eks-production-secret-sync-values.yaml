# Bootstrap overlay for the production ExternalSecrets stage.
#
# Render/install this overlay together with eks-production-values.yaml under a
# separate release name. It deliberately emits only ExternalSecret resources.
# Wait for all four ExternalSecrets and their target Kubernetes Secrets before
# installing the main production release, whose ExternalSecrets stay disabled.

scanner:
  enabled: false

rbac:
  create: false

serviceAccount:
  create: false

monitor:
  enabled: false

networkPolicy:
  enabled: false

teardownHooks:
  enabled: false

controlPlane:
  enabled: false
  externalSecrets:
    enabled: true
    syncOnly: true
