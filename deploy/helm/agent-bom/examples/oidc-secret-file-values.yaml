# Overlay for a confidential OIDC browser client. Use with a control-plane
# profile such as eks-mcp-pilot-values.yaml after creating the referenced
# Kubernetes Secret from an operator-managed file.
controlPlane:
  api:
    env:
      - name: AGENT_BOM_OIDC_CLIENT_SECRET_FILE
        value: /run/agent-bom/oidc/client_secret
    extraVolumes:
      - name: oidc-client-secret
        secret:
          secretName: agent-bom-oidc-client
          items:
            - key: client_secret
              path: client_secret
    extraVolumeMounts:
      - name: oidc-client-secret
        mountPath: /run/agent-bom/oidc
        readOnly: true
