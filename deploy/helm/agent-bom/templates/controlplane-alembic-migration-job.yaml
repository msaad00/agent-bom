{{- if and .Values.controlPlane.enabled .Values.controlPlane.migrations.enabled .Values.controlPlane.migrations.postgres.enabled }}
{{- $migrations := .Values.controlPlane.migrations }}
{{- if .Values.controlPlane.externalSecrets.enabled }}
{{- fail "a Postgres migration cannot consume ExternalSecrets reconciled by the same release; create and wait for the target Secrets in a separate secret-sync release, then install with controlPlane.externalSecrets.enabled=false" }}
{{- end }}
{{- $envFrom := $migrations.envFrom }}
{{- $postgresSecrets := .Values.controlPlane.postgresSecrets }}
{{- if $postgresSecrets.enabled }}
{{- $appSecret := required "controlPlane.postgresSecrets.appSecretRef.name is required" $postgresSecrets.appSecretRef.name }}
{{- $maintenanceSecret := required "controlPlane.postgresSecrets.maintenanceSecretRef.name is required" $postgresSecrets.maintenanceSecretRef.name }}
{{- $adminSecret := required "controlPlane.postgresSecrets.adminSecretRef.name is required" $postgresSecrets.adminSecretRef.name }}
{{- if ne (len (uniq (list $appSecret $maintenanceSecret $adminSecret))) 3 }}
{{- fail "controlPlane.postgresSecrets app, maintenance, and admin Secret names must be distinct" }}
{{- end }}
{{- if $envFrom }}
{{- fail "controlPlane.migrations.envFrom cannot be combined with canonical Postgres Secrets" }}
{{- end }}
{{- range $entry := $migrations.env }}
{{- if has (get $entry "name") (list "AGENT_BOM_POSTGRES_URL" "AGENT_BOM_POSTGRES_MAINTENANCE_URL" "ALEMBIC_DATABASE_URL") }}
{{- fail "controlPlane.migrations.env cannot override canonical Postgres identity variables when controlPlane.postgresSecrets.enabled=true" }}
{{- end }}
{{- end }}
{{- else }}
{{- $hasExplicitAdminEnv := false }}
{{- range $entry := $migrations.env }}
{{- if eq (get $entry "name") "ALEMBIC_DATABASE_URL" }}
{{- $hasExplicitAdminEnv = true }}
{{- end }}
{{- end }}
{{- if not $hasExplicitAdminEnv }}
{{- fail "controlPlane.migrations requires canonical controlPlane.postgresSecrets or an explicit ALEMBIC_DATABASE_URL env reference; generic envFrom cannot prove an admin identity" }}
{{- end }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agent-bom.name" . }}-postgres-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-bom.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-migration
  annotations:
    helm.sh/hook: {{ $migrations.hooks | quote }}
    helm.sh/hook-weight: {{ $migrations.hookWeight | quote }}
    helm.sh/hook-delete-policy: {{ $migrations.deletePolicy | quote }}
spec:
  ttlSecondsAfterFinished: {{ $migrations.ttlSecondsAfterFinished }}
  backoffLimit: {{ $migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "agent-bom.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres-migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: alembic
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: {{ $migrations.workingDir | quote }}
          command:
            - python
            - deploy/supabase/postgres/compose_migrate.py
            - --config
            - {{ $migrations.alembicConfig | quote }}
          env:
            {{- with $migrations.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if $postgresSecrets.enabled }}
            - name: ALEMBIC_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $postgresSecrets.adminSecretRef.name | quote }}
                  key: ALEMBIC_DATABASE_URL
            - name: AGENT_BOM_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $postgresSecrets.appSecretRef.name | quote }}
                  key: AGENT_BOM_POSTGRES_URL
            - name: AGENT_BOM_POSTGRES_MAINTENANCE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $postgresSecrets.maintenanceSecretRef.name | quote }}
                  key: AGENT_BOM_POSTGRES_MAINTENANCE_URL
            {{- end }}
          {{- with $envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $migrations.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
