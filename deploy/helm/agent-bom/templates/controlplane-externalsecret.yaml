{{- $externalSecrets := .Values.controlPlane.externalSecrets }}
{{- if and $externalSecrets.syncOnly .Values.controlPlane.enabled }}
{{- fail "controlPlane.externalSecrets.syncOnly requires controlPlane.enabled=false; use a separate secret-sync release before the workload release" }}
{{- end }}
{{- if and $externalSecrets.enabled (or .Values.controlPlane.enabled $externalSecrets.syncOnly) }}
{{- $defaults := .Values.controlPlane.externalSecrets }}
{{- $secrets := $defaults.secrets }}
{{- if not $secrets }}
{{- $secrets = list (dict "nameSuffix" "control-plane" "refreshInterval" $defaults.refreshInterval "secretStoreRef" $defaults.secretStoreRef "target" $defaults.target "data" $defaults.data) }}
{{- end }}
{{- range $index, $secret := $secrets }}
{{- $secretStoreRef := default (dict) (get $secret "secretStoreRef") }}
{{- $target := default (dict) (get $secret "target") }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "agent-bom.name" $ }}-{{ default "control-plane" $secret.nameSuffix }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "agent-bom.labels" $ | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  refreshInterval: {{ default $defaults.refreshInterval $secret.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ default $defaults.secretStoreRef.kind (get $secretStoreRef "kind") }}
    name: {{ default $defaults.secretStoreRef.name (get $secretStoreRef "name") | quote }}
  target:
    name: {{ default $defaults.target.name (get $target "name") | quote }}
    creationPolicy: {{ default $defaults.target.creationPolicy (get $target "creationPolicy") }}
    template:
      {{- with (get $secret "template") }}
      {{- with .engineVersion }}
      engineVersion: {{ . }}
      {{- end }}
      {{- end }}
      metadata:
        labels:
          {{- include "agent-bom.labels" $ | nindent 10 }}
          app.kubernetes.io/component: control-plane
      {{- with (get (default (dict) (get $secret "template")) "data") }}
      # Compose the final value from the fields pulled in ``data`` below. Lets
      # a credential the platform already manages and rotates (an RDS master
      # secret) become a connection string without any operator step, and
      # without the password passing through Terraform state.
      data:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  data:
    {{- toYaml (default $defaults.data $secret.data) | nindent 4 }}
{{- end }}
{{- end }}
