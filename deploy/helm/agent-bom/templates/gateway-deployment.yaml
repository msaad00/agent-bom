{{- $profileEnforcement := .Values.gateway.profileEnforcement | default "off" -}}
{{- $gatewayEnvFrom := .Values.gateway.envFrom -}}
{{- $gatewayPersistence := .Values.gateway.persistence | default dict -}}
{{- $gatewayRuntimeReplicas := int (.Values.gateway.replicas | default 1) -}}
{{- if or (.Values.gateway.autoscaling.enabled | default false) (.Values.gateway.autoscaling.keda.enabled | default false) -}}
{{- $gatewayRuntimeReplicas = int (.Values.gateway.autoscaling.maxReplicas | default 2) -}}
{{- end -}}
{{- if and .Values.gateway.enabled (not ($gatewayPersistence.enabled | default false)) -}}
{{- fail "gateway audit requires gateway.persistence.enabled=true and a restart-stable PVC, including control-plane-connected deployments" -}}
{{- end -}}
{{- if and .Values.gateway.enabled ($gatewayPersistence.enabled | default false) (ne (int (.Values.gateway.replicas | default 1)) 1) -}}
{{- fail "gateway persistence requires gateway.replicas=1 because durable delivery claims are process-owned" -}}
{{- end -}}
{{- if and .Values.gateway.enabled ($gatewayPersistence.enabled | default false) (or (.Values.gateway.autoscaling.enabled | default false) (.Values.gateway.autoscaling.keda.enabled | default false)) -}}
{{- fail "gateway persistence is incompatible with gateway autoscaling until cross-pod delivery leases are implemented" -}}
{{- end -}}
{{- if and .Values.gateway.enabled ($gatewayPersistence.enabled | default false) (not ($gatewayPersistence.existingClaim | default "")) -}}
{{- fail "gateway.persistence.existingClaim is required when gateway persistence is enabled" -}}
{{- end -}}
{{- if and .Values.gateway.enabled (ne $profileEnforcement "off") (not $gatewayEnvFrom) -}}
{{- fail "gateway profile enforcement requires gateway.envFrom with a gateway-scoped Secret containing the shared AGENT_BOM_POSTGRES_URL" -}}
{{- end -}}
{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-bom.name" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-bom.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas | default 1 }}
  {{- if ($gatewayPersistence.enabled | default false) }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agent-bom.name" . }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "agent-bom.labels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ include "agent-bom.gatewayServiceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository | default "agentbom/agent-bom" }}:{{ .Values.gateway.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy | default "IfNotPresent" }}
          command:
            - agent-bom
            - gateway
            - serve
            - --bind
            - "0.0.0.0:8090"
            - --upstreams
            - /etc/agent-bom/gateway/upstreams.yaml
            {{- if .Values.gateway.controlPlaneDiscovery.url }}
            - --from-control-plane
            - {{ .Values.gateway.controlPlaneDiscovery.url | quote }}
            {{- end }}
            {{- if .Values.gateway.policyPath }}
            - --policy
            - {{ .Values.gateway.policyPath }}
            {{- end }}
            {{- if gt (int (.Values.gateway.policyReloadSeconds | default 0)) 0 }}
            - --policy-reload-seconds
            - {{ .Values.gateway.policyReloadSeconds | quote }}
            {{- end }}
            {{- if .Values.gateway.firewallPolicyPath }}
            - --firewall-policy
            - {{ .Values.gateway.firewallPolicyPath }}
            {{- end }}
            {{- if gt (int (.Values.gateway.firewallPolicyReloadSeconds | default 0)) 0 }}
            - --firewall-policy-reload-seconds
            - {{ .Values.gateway.firewallPolicyReloadSeconds | quote }}
            {{- end }}
            {{- if gt (int (.Values.gateway.runtimeRateLimitPerTenantPerMinute | default 0)) 0 }}
            - --runtime-rate-limit-per-tenant-per-minute
            - {{ .Values.gateway.runtimeRateLimitPerTenantPerMinute | quote }}
            {{- end }}
            {{- if .Values.gateway.requireSharedRateLimit }}
            - --require-shared-rate-limit
            {{- end }}
            {{- with .Values.gateway.graphReachability }}
            - --graph-reachability-enforcement
            - {{ .enforcement | default "off" | quote }}
            {{- if .bundleUrl }}
            - --graph-reachability-bundle-url
            - {{ .bundleUrl | quote }}
            - --graph-reachability-bundle-tenant
            - {{ .tenant | default "default" | quote }}
            - --graph-reachability-bundle-poll-seconds
            - {{ .pollSeconds | default 30 | quote }}
            - --graph-reachability-failure-mode
            - {{ .failureMode | default "allow" | quote }}
            {{- if .signingKeyFile }}
            - --graph-reachability-bundle-signing-key-file
            - {{ .signingKeyFile | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if ne $profileEnforcement "off" }}
            - --profile-enforcement
            - {{ .Values.gateway.profileEnforcement | quote }}
            - --profile-environment
            - {{ required "gateway.profileEnvironment is required when profile enforcement is enabled" .Values.gateway.profileEnvironment | quote }}
            - --profile-issuer
            - {{ .Values.gateway.profileIssuer | default "agent-bom" | quote }}
            {{- end }}
            {{- if .Values.gateway.detectVisualLeaks }}
            - --detect-visual-leaks
            {{- end }}
            {{- if .Values.gateway.allowVisualLeakBestEffort }}
            - --allow-visual-leak-best-effort
            {{- end }}
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          env:
            - name: AGENT_BOM_GATEWAY_REPLICAS
              value: {{ $gatewayRuntimeReplicas | quote }}
            - name: AGENT_BOM_STATE_DIR
              {{- if ($gatewayPersistence.enabled | default false) }}
              value: {{ $gatewayPersistence.mountPath | default "/var/lib/agent-bom" | quote }}
              {{- else }}
              value: {{ .Values.gateway.stateDir | default "/tmp/agent-bom" | quote }}
              {{- end }}
          {{- with .Values.gateway.env }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $gatewayEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml (.Values.gateway.resources | default dict) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: upstreams
              mountPath: /etc/agent-bom/gateway
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if ($gatewayPersistence.enabled | default false) }}
            - name: audit-state
              mountPath: {{ $gatewayPersistence.mountPath | default "/var/lib/agent-bom" | quote }}
            {{- end }}
            {{- with .Values.gateway.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: upstreams
          configMap:
            name: {{ include "agent-bom.name" . }}-gateway-upstreams
        - name: tmp
          emptyDir: {}
        {{- if ($gatewayPersistence.enabled | default false) }}
        - name: audit-state
          persistentVolumeClaim:
            claimName: {{ required "gateway.persistence.existingClaim is required" $gatewayPersistence.existingClaim | quote }}
        {{- end }}
        {{- with .Values.gateway.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-bom.name" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-bom.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8090
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "agent-bom.name" . }}
    app.kubernetes.io/component: gateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-bom.name" . }}-gateway-upstreams
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-bom.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
data:
  upstreams.yaml: |
{{ .Values.gateway.upstreamsYaml | default "upstreams: []\n" | indent 4 }}
{{- end }}
