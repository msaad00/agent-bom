manifest_version: 1

version:
  name: v0_106_0
  patch: 0
  label: "agent-bom 0.106.0"
  comment: >-
    Map the full trust chain from AI agents and MCP servers to CVEs,
    credentials, and blast radius. Discover, scan, and secure your
    AI infrastructure from a single Snowflake Native App.

artifacts:
  setup_script: scripts/setup.sql
  readme: README.md
  default_web_endpoint:
    service: core.agent_bom_api
    endpoint: ui
  container_services:
    uses_gpu: false
    images:
      - /agent_bom_provider/spcs/agent_bom_repo/agent-bom:v0_106_0
      - /agent_bom_provider/spcs/agent_bom_repo/agent-bom-ui:v0_106_0
      - /agent_bom_provider/spcs/agent_bom_repo/agent-bom-scanner:v0_106_0
      - /agent_bom_provider/spcs/agent_bom_repo/agent-bom-mcp-runtime:v0_106_0

privileges:
  - CREATE COMPUTE POOL:
      description: Required to run the agent-bom API container
  - BIND SERVICE ENDPOINT:
      description: Required to expose the API endpoint internally

configuration:
  log_level: INFO
  grant_callback: core.grant_callback

references:
  - cloud_asset_tables:
      label: "Cloud Asset Tables"
      description: >-
        SELECT access to the customer's cloud asset inventory tables.
        agent-bom reads these tables to discover cloud resources for scanning.
        No write access is requested or granted.
      multi_valued: false
      register_callback: core.register_reference
      object_type: TABLE
      privileges:
        - SELECT
  - iam_tables:
      label: "IAM Tables"
      description: >-
        SELECT access to the customer's IAM/identity tables.
        agent-bom reads these to map principal-to-resource relationships.
        No write access is requested or granted.
      multi_valued: false
      register_callback: core.register_reference
      object_type: TABLE
      privileges:
        - SELECT
  - vuln_tables:
      label: "Vulnerability Tables"
      description: >-
        SELECT access to the customer's existing vulnerability data tables
        (optional — agent-bom can populate these itself).
        No write access is requested or granted.
      multi_valued: false
      register_callback: core.register_reference
      object_type: TABLE
      privileges:
        - SELECT
  - log_tables:
      label: "Audit Log Tables"
      description: >-
        SELECT access to the customer's audit log / CloudTrail tables.
        agent-bom reads these to correlate access patterns with findings.
        No write access is requested or granted.
      multi_valued: false
      register_callback: core.register_reference
      object_type: TABLE
      privileges:
        - SELECT
  - artifact_stages:
      label: "Artifact Stages"
      description: >-
        READ access to the customer's artifact stages (container images,
        model files). agent-bom reads manifest files to enumerate packages.
        No write access is requested or granted.
      multi_valued: false
      register_callback: core.register_reference
      object_type: STAGE
      privileges:
        - READ
  - osv_dev:
      label: "OSV.dev Advisory Feed"
      description: "Optional advisory/package egress; bind explicitly before enabling the scanner."
      object_type: EXTERNAL ACCESS INTEGRATION
      privileges: [USAGE]
      multi_valued: false
      required_at_setup: false
      register_callback: core.register_reference
      configuration_callback: core.get_reference_configuration
  - cisa_kev:
      label: "CISA KEV Feed"
      description: "Optional advisory/package egress; bind explicitly before enabling the scanner."
      object_type: EXTERNAL ACCESS INTEGRATION
      privileges: [USAGE]
      multi_valued: false
      required_at_setup: false
      register_callback: core.register_reference
      configuration_callback: core.get_reference_configuration
  - first_epss:
      label: "FIRST EPSS Feed"
      description: "Optional advisory/package egress; bind explicitly before enabling the scanner."
      object_type: EXTERNAL ACCESS INTEGRATION
      privileges: [USAGE]
      multi_valued: false
      required_at_setup: false
      register_callback: core.register_reference
      configuration_callback: core.get_reference_configuration
  - github_ghsa:
      label: "GitHub Advisory Database (GHSA)"
      description: "Optional advisory/package egress; bind explicitly before enabling the scanner."
      object_type: EXTERNAL ACCESS INTEGRATION
      privileges: [USAGE]
      multi_valued: false
      required_at_setup: false
      register_callback: core.register_reference
      configuration_callback: core.get_reference_configuration
  - nvd_api:
      label: "NVD REST API"
      description: "Optional advisory/package egress; bind explicitly before enabling the scanner."
      object_type: EXTERNAL ACCESS INTEGRATION
      privileges: [USAGE]
      multi_valued: false
      required_at_setup: false
      register_callback: core.register_reference
      configuration_callback: core.get_reference_configuration
  - deps_dev:
      label: "deps.dev"
      description: "Optional advisory/package egress; bind explicitly before enabling the scanner."
      object_type: EXTERNAL ACCESS INTEGRATION
      privileges: [USAGE]
      multi_valued: false
      required_at_setup: false
      register_callback: core.register_reference
      configuration_callback: core.get_reference_configuration
  - package_registries:
