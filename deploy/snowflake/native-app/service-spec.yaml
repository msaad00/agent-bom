spec:
  containers:
    - name: agent-bom
      image: /agent_bom_provider/spcs/agent_bom_repo/agent-bom:v0_106_0
      env:
        AGENT_BOM_DB: /var/lib/agent-bom/control-plane.db
        AGENT_BOM_GRAPH_DB: /var/lib/agent-bom/control-plane.db
        AGENT_BOM_STATE_DIR: /var/lib/agent-bom
        AGENT_BOM_AUDIT_HMAC_KEY_FILE: /var/lib/agent-bom/audit-hmac.key
        AGENT_BOM_REQUIRE_AUDIT_HMAC: "1"
        AGENT_BOM_CONTROL_PLANE_REPLICAS: "1"
        AGENT_BOM_SNOWFLAKE_NATIVE_APP: "1"
        AGENT_BOM_MCP_MODE: "0"
        AGENT_BOM_LOG_LEVEL: "INFO"
      volumeMounts:
        - name: evidence
          mountPath: /var/lib/agent-bom
        - name: tmp
          mountPath: /tmp/agent-bom
      readinessProbe:
        port: 8422
        path: /health
      resources:
        requests:
          memory: 512M
          cpu: 0.5
        limits:
          memory: 2G
          cpu: 2

    - name: agent-bom-ui
      image: /agent_bom_provider/spcs/agent_bom_repo/agent-bom-ui:v0_106_0
      env:
        NEXT_PUBLIC_API_URL: "http://localhost:8422"
        NODE_ENV: production
        PORT: "3000"
      readinessProbe:
        port: 3000
        path: /api/health
      resources:
        requests:
          memory: 256M
          cpu: 0.25
        limits:
          memory: 1G
          cpu: 1

  volumes:
    - name: evidence
      source: block
      size: 4Gi
      blockConfig:
        encryption: SNOWFLAKE_FULL
        snapshotOnDelete: true
        snapshotDeleteAfter: 7d
    - name: tmp
      source: local
      size: 1Gi

  endpoints:
    - name: api
      port: 8422
      public: false

    - name: ui
      port: 3000
      public: false

serviceRoles:
  - name: api
    endpoints: [api]
  - name: ui
    endpoints: [ui]
