    <text x="1220" y="251" text-anchor="end" fill="#64748b" font-size="11">Also supports VS Code · Okta · ClickHouse</text>
    <line x1="626" y1="243" x2="626" y2="373" stroke="#64748b" stroke-width="2" stroke-linecap="round" opacity="0.85" />

