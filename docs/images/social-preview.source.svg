        <image href="vendor/simple-icons/microsoftazure.svg" x="10" y="10" width="44" height="44" filter="url(#tint-azure)"/>
        <text x="32" y="87" text-anchor="middle" fill="#cbd5e1" font-size="13" font-weight="600">Azure</text>
