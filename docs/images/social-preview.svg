<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="agent-bom: discover, scan, correlate, and graph security evidence across repositories, AI clients, cloud, identity, infrastructure, and data platforms">
  <defs>
