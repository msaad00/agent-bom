name: agent-bom
image: agentbom/agent-bom
type: server

meta:
  category: security
  tags:
    - security
    - ai
    - supply-chain
    - sbom
    - vulnerability-scanning
    - mcp
    - compliance
    - devops

about:
  title: agent-bom
  description: >-
    Open security scanner and graph for agentic infrastructure —
    discover agents and MCP, map blast radius, and inspect runtime.
  icon: https://raw.githubusercontent.com/msaad00/agent-bom/main/docs/images/brand/logo-dark.svg

source:
  project: https://github.com/msaad00/agent-bom
  commit: 3b01fcf28e5e939f7eee5b3acae71467b6d9501b

run:
  env:
    - name: NVD_API_KEY
      description: NVD API key for higher rate limits on vulnerability enrichment (optional)
    - name: YDC_API_KEY
      description: You.com API key enabling the optional youcom_search tool (optional)
  allowHosts:
    - api.osv.dev:443
    - services.nvd.nist.gov:443
    - api.first.org:443
    - api.github.com:443
    - registry.npmjs.org:443
    - pypi.org:443
    - proxy.golang.org:443
    # Only reached by youcom_search, and only when YDC_API_KEY is set.
    - ydc-index.io:443

config:
  secrets:
    - name: agent-bom.nvd_api_key
      env: NVD_API_KEY
      example: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
      description: "NVD API key — optional, increases rate limits for vulnerability enrichment"
    - name: agent-bom.ydc_api_key
      env: YDC_API_KEY
      example: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      description: "You.com API key — optional, enables the youcom_search tool for live web/news context"
