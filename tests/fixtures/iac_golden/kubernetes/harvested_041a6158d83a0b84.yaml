apiVersion: v1
kind: Pod
metadata:
  name: amd-gpu-workload
  namespace: prod
spec:
  automountServiceAccountToken: false
  containers:
    - name: rocm-trainer
      image: rocm/pytorch:latest
      securityContext:
        privileged: true
        readOnlyRootFilesystem: false
      resources:
        limits:
          amd.com/gpu: "1"
