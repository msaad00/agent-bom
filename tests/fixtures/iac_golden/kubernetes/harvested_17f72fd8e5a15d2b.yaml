apiVersion: v1
kind: Pod
metadata:
  name: app
  namespace: prod
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: myapp:1.0
      securityContext:
        readOnlyRootFilesystem: true
      resources:
        limits:
          cpu: "1"
          memory: "1Gi"
  volumes:
    - name: data
      hostPath:
        path: /var/data
