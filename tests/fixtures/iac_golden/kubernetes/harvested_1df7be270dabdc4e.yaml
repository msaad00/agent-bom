apiVersion: v1
kind: Pod
metadata:
  name: gpu-workload
  namespace: prod
spec:
  automountServiceAccountToken: false
  containers:
    - name: trainer
      image: nvcr.io/nvidia/pytorch:23.10-py3
      securityContext:
        privileged: true
        readOnlyRootFilesystem: false
      resources:
        limits:
          nvidia.com/gpu: "1"
          cpu: "4"
          memory: "16Gi"
