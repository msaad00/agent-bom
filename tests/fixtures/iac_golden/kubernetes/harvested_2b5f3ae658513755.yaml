apiVersion: v1
kind: Pod
metadata:
  name: gpu-direct
  namespace: prod
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: nvcr.io/nvidia/cuda:12.3
      securityContext:
        readOnlyRootFilesystem: true
      resources:
        limits:
          cpu: "1"
          memory: "1Gi"
  volumes:
    - name: nv-proc
      hostPath:
        path: /proc/driver/nvidia
