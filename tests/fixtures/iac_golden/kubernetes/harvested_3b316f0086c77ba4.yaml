apiVersion: v1
kind: Pod
metadata:
  name: gpu-workload
  namespace: prod
spec:
  automountServiceAccountToken: false
  containers:
    - name: trainer
      image: nvcr.io/nvidia/cuda:12.3
      securityContext:
        allowPrivilegeEscalation: true
        readOnlyRootFilesystem: false
      resources:
        limits:
          nvidia.com/gpu: "2"
