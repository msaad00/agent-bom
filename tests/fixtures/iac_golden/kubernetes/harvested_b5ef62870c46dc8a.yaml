apiVersion: v1
kind: Pod
metadata:
  name: test
  namespace: prod
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: myapp:1.0
      env:
        - name: DB_PASSWORD
          value: "supersecretpassword123"
      securityContext:
        readOnlyRootFilesystem: true
      resources:
        limits:
          cpu: "1"
