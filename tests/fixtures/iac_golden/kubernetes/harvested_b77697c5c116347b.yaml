apiVersion: v1
kind: Pod
metadata:
  name: gpu-direct
  namespace: prod
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: nvcr.io/nvidia/cuda:12.3
      securityContext:
        readOnlyRootFilesystem: true
      resources:
        limits:
          cpu: "1"
          memory: "1Gi"
      volumeMounts:
        - name: nvidia-dev
          mountPath: /dev/nvidia0
  volumes:
    - name: nvidia-dev
      hostPath:
        path: /dev/nvidia0
