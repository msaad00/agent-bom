apiVersion: v1
kind: Pod
metadata:
  name: test
  namespace: prod
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: myapp:1.0
      securityContext:
        privileged: true
        readOnlyRootFilesystem: true
      resources:
        limits:
          cpu: "1"
          memory: "512Mi"
