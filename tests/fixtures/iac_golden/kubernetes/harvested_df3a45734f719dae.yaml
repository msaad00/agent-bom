apiVersion: v1
kind: Pod
metadata:
  name: gpu-workload
  namespace: prod
spec:
  automountServiceAccountToken: false
  containers:
    - name: trainer
      image: nvcr.io/nvidia/cuda:12.3
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
      resources:
        limits:
          nvidia.com/gpu: "1"
          cpu: "4"
          memory: "16Gi"
