apiVersion: v1
kind: Pod
metadata:
  name: test
  namespace: prod
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: myapp:1.0
      readinessProbe:
        tcpSocket:
          port: 8080
      securityContext:
        readOnlyRootFilesystem: true
      resources:
        limits:
          cpu: "1"
          memory: "256Mi"
